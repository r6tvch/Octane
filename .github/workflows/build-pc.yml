name: Build PC
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        shell: bash
        run: unzip -o RogueWest-desktop.zip
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Install
        working-directory: RogueWest-desktop
        run: npm install
      - name: Embed fonts
        working-directory: RogueWest-desktop
        run: node prepare-fonts.js
      - name: Build
        working-directory: RogueWest-desktop
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: RogueWest-${{ runner.os }}
          path: |
            RogueWest-desktop/dist/*.exe
            RogueWest-desktop/dist/*.dmg
            RogueWest-desktop/dist/*.AppImage
          if-no-files-found: ignore
